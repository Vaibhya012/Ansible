- name: use_items
  hosts: localhost
  become: true
  connection: local
  tasks:
    - name: install LEMP
      apt:
        name: "{{ item }}"
        state: present
      with_items:
        - nginx
        - php
        - php8.3-fpm
        - mariadb-server

    - name: start service
      service:
        name: "{{ item }}"
        state: started
      with_items:
        - nginx
        - php8.3-fpm
        - mariadb

    - name: restart service
      service:
        name: "{{ item }}"
        state: restarted
      with_items:
        - nginx
        - php8.3-fpm
        - mariadb
